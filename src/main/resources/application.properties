# Puerto del servidor Backend
server.port=8080

# Conexion a Base de Datos Relacional MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/veterinaria_san_marcos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuracion JPA / Hibernate (Crea y actualiza las 5 tablas automaticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Clave secreta para firmar Tokens JWT (Minimo 256 bits)
jwt.secret=ClaveSecretaSuperSeguraVeterinariaSanMarcosDuocUC2026FullstackII
jwt.expiration=86400000